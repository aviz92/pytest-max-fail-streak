[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-max-fail-streak"
version = "1.0.0"
description = "A pytest plugin that stops the run after N consecutive failing tests, so a broken environment fails fast."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Avi Zaguri" },]

keywords = [
    "pytest",
    "plugin",
    "testing",
    "maxfail",
    "fail-fast",
    "ci",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pytest>=9.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "python-base-command>=0.1.8",
    "setuptools>=84.0.0",
    "wheel>=0.45.1",
]

[project.urls]
Homepage = "https://github.com/aviz92/pytest-max-fail-streak"
Repository = "https://github.com/aviz92/pytest-max-fail-streak"
Issues = "https://github.com/aviz92/pytest-max-fail-streak/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytest_max_fail_streak*"]
namespaces = false

[project.entry-points.pytest11]
max_fail_streak = "pytest_max_fail_streak.plugin"
